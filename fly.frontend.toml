app = "torletapp"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"
  build-target = "frontend-fly"
  [build.args]
    VITE_API_BASE_URL = "https://torlet-backend.fly.dev/api"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpus = 1
