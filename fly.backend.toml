app = "torlet-backend"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"
  build-target = "backend"

[deploy]
  release_command = "python manage.py migrate"

[processes]
  app = "python manage.py runserver 0.0.0.0:8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpus = 1
