components:
  schemas:
    Booking:
      type: object
      properties:
        booking_id:
          type: string
          format: uuid
          readOnly: true
        booking_number:
          type: string
          readOnly: true
        customer:
          type: integer
          readOnly: true
        restaurant:
          type: string
          format: uuid
        location:
          type: string
          format: uuid
        table:
          type: string
          format: uuid
          nullable: true
        booking_date:
          type: string
          format: date
        booking_time:
          type: string
          format: time
        number_of_guests:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        duration_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        special_request:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        cancellation_reason:
          type: string
          readOnly: true
      required:
      - booking_date
      - booking_id
      - booking_number
      - booking_time
      - cancellation_reason
      - cancelled_at
      - completed_at
      - confirmed_at
      - created_at
      - customer
      - location
      - number_of_guests
      - restaurant
      - status
      - updated_at
    BookingCancel:
      type: object
      properties:
        cancellation_reason:
          type: string
          maxLength: 1000
    BookingComment:
      type: object
      properties:
        comment_id:
          type: string
          format: uuid
          readOnly: true
        booking:
          type: string
          format: uuid
        staff:
          type: integer
          readOnly: true
        comment:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_visible_to_customer:
          type: boolean
      required:
      - booking
      - comment
      - comment_id
      - created_at
      - staff
    BookingCreate:
      type: object
      properties:
        restaurant:
          type: string
          format: uuid
        location:
          type: string
          format: uuid
        table:
          type: string
          format: uuid
          nullable: true
        booking_date:
          type: string
          format: date
        booking_time:
          type: string
          format: time
          description: 'Accepted: HH:MM, HH:MM:SS, HH:MM:SS.sss or HH:MM:SS.sssZ'
        number_of_guests:
          type: integer
          minimum: 1
        duration_minutes:
          type: integer
          minimum: 30
          default: 120
        special_request:
          type: string
      required:
      - booking_date
      - booking_time
      - location
      - number_of_guests
    LocationCreate:
      type: object
      description: Сериализатор для создания локации
      properties:
