        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLocationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLocationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLocationCreate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationCreate'
          description: ''
    delete:
      operationId: cafes_locations_destroy
      summary: Delete location
      parameters:
      - in: path
        name: location_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - Locations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/cafes/locations/{location_id}/tables/:
    get:
      operationId: cafes_locations_tables_retrieve
      summary: List tables in location
      parameters:
      - in: path
        name: location_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: query
        name: max_capacity
        schema:
          type: integer
      - in: query
        name: min_capacity
        schema:
          type: integer
      - in: query
        name: table_type
        schema:
          type: string
      tags:
      - Locations
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
          description: ''
