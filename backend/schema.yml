openapi: 3.0.3
info:
  title: Diploma Cafe Booking API
  version: 1.0.0
  description: API documentation for authentication, cafe catalog, and booking flows.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Login and get JWT token pair
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhoneTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneTokenObtainPair'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      summary: Get current user profile
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      summary: Register new user account
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/staff/promote/:
    post:
      operationId: auth_staff_promote_create
      summary: Promote user to restaurant staff
      tags:
      - Staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantStaffCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RestaurantStaffCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RestaurantStaffCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantStaffCreate'
          description: ''
  /api/auth/test/:
    get:
      operationId: auth_test_retrieve
      summary: Test protected endpoint
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
