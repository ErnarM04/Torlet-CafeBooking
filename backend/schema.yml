      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingComment'
          description: ''
  /api/booking-comments/{comment_id}/:
    get:
      operationId: booking_comments_retrieve
      summary: Get booking comment details
      parameters:
      - in: path
        name: comment_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - Booking Comments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingComment'
          description: ''
  /api/bookings/:
    get:
      operationId: bookings_list
      summary: List current user bookings
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
          description: ''
    post:
      operationId: bookings_create
      summary: Create a booking
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreate'
          description: ''
  /api/bookings/{booking_id}/:
    get:
      operationId: bookings_retrieve
      summary: Get booking details
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/bookings/{booking_id}/cancel/:
    post:
      operationId: bookings_cancel_create
      summary: Cancel a booking
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCancel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCancel'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCancel'
          description: ''
  /api/bookings/availability/:
    get:
      operationId: bookings_availability_retrieve
      summary: Check booking availability
      parameters:
      - in: query
        name: booking_date
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: booking_time
        schema:
          type: string
          format: time
        required: true
      - in: query
        name: duration_minutes
        schema:
          type: integer
      - in: query
        name: location
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: number_of_guests
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
