  /api/cafes/tables/:
    get:
      operationId: cafes_tables_list
      summary: List tables
      parameters:
      - in: query
        name: is_available
        schema:
          type: boolean
      - in: query
        name: location
        schema:
          type: string
          format: uuid
      - in: query
        name: table_type
        schema:
          type: string
          title: Тип Столика
          enum:
          - bar
          - indoor
          - outdoor
          - private
          - terrace
          - vip
        description: |-
          * `indoor` - Indoor
          * `outdoor` - Outdoor
          * `vip` - VIP
          * `terrace` - Terrace
          * `bar` - Bar Seating
          * `private` - Private Room
      tags:
      - Tables
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'
          description: ''
    post:
      operationId: cafes_tables_create
      summary: Create table
      tags:
      - Tables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TableCreate'
          multipart/form-data:
            schema:
