    get:
      operationId: cafes_restaurants_list
      summary: List restaurants
      parameters:
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: cuisine_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Restaurants
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantList'
          description: ''
    post:
      operationId: cafes_restaurants_create
      summary: Create restaurant
      tags:
      - Restaurants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantCreate'
          application/x-www-form-urlencoded:
