          type: string
          format: date
        required: true
      - in: query
        name: duration
        schema:
          type: integer
      - in: path
        name: table_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: query
        name: time
        schema:
          type: string
          format: time
        required: true
      tags:
      - Tables
      security:
      - jwtAuth: []
      - {}
      responses:
